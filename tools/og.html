<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG image source (1200x630)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@500&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#E4F4EA}
  .og{width:1200px;height:630px;display:grid;grid-template-columns:1fr 520px;align-items:center;padding:0 72px;gap:40px}
  .og .h1{font-size:74px;letter-spacing:-2.6px;line-height:.98;margin:0 0 18px}
  .og .lede{font-size:24px;margin:0 0 26px;max-width:520px}
  .og .brand{font-size:26px;margin-bottom:34px}
  .og .brand img{width:40px;height:40px;border-radius:10px}
  .og .stickers{grid-template-columns:repeat(3,1fr);margin:0;max-width:520px;gap:22px}
  .og .stk em{font-size:15px;padding:5px 11px;bottom:-12px}
</style>
</head>
<body>
<div class="og">
  <div>
    <div class="brand"><img src="/assets/art/logo.png" alt="">Lens<b>Report</b></div>
    <h1 class="h1">Every dollar gets a face.</h1>
    <p class="lede">The AI expense tracker. Snap it, say it or tap it, then ask where the money went.</p>
    <span class="btn btn-dark" style="font-size:18px;padding:16px 24px">Free on the App Store</span>
  </div>
  <div class="stickers">
    <div class="stk"><img src="/assets/art/cat_coffee.png" alt=""><em>$12.00</em></div>
    <div class="stk"><img src="/assets/art/cat_groceries.png" alt=""><em>$86.40</em></div>
    <div class="stk"><img src="/assets/art/cat_fuel.png" alt=""><em>$64.20</em></div>
    <div class="stk"><img src="/assets/art/cat_streaming.png" alt=""><em>$15.99</em></div>
    <div class="stk"><img src="/assets/art/cat_takeaway.png" alt=""><em>$31.90</em></div>
    <div class="stk"><img src="/assets/art/cat_pharmacy.png" alt=""><em>$24.50</em></div>
  </div>
</div>
</body>
</html>
